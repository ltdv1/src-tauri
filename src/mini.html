<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BETTERCLOUD Mini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root,
      :root[data-theme="dark"] {
        --bg: #12141b;
        --panel: #171a23;
        --line: rgba(255, 255, 255, 0.09);
        --text-0: #f4f5f8;
        --text-1: #a7adbf;
        --text-2: #6d7488;
        --accent: #ff5b23;
        --accent-2: #ff8a3d;
        --on-accent: #17130f;
      }
      :root[data-theme="midnight"] {
        --bg: #0a0f1f;
        --panel: #0e1428;
        --line: rgba(140, 165, 255, 0.14);
        --text-0: #eef2ff;
        --text-1: #9fadd6;
        --text-2: #64719c;
        --accent: #6f8bff;
        --on-accent: #0a0e1c;
      }
      :root[data-theme="light"] {
        --bg: #f2f3f8;
        --panel: #ffffff;
        --line: rgba(20, 24, 40, 0.12);
        --text-0: #191d29;
        --text-1: #4c5468;
        --text-2: #8b93a8;
        --accent: #f4480c;
        --on-accent: #fff;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text-0);
        font-family: "DM Sans", system-ui, sans-serif;
        user-select: none;
        border-radius: 12px;
      }

      svg {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
        display: grid;
        place-items: center;
      }

      .mini {
        height: 100vh;
        display: grid;
        grid-template-columns: 72px 1fr;
        background:
          radial-gradient(220px 120px at 0% 100%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%),
          var(--bg);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      /* ---------- обложка ---------- */
      .art-side {
        position: relative;
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      .art-side img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .art-side img:not([src]) { display: none; }

      /* ---------- правая часть ---------- */
      .info-side {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 4px 7px;
        min-width: 0;
      }

      .mini-top {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 16px;
      }
      .mini-brand {
        flex: 1 1 auto;
        min-width: 0;
        font-family: "Manrope", sans-serif;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.22em;
        color: var(--text-2);
        white-space: nowrap;
        overflow: hidden;
      }
      .mini-brand b { color: var(--accent); font-weight: 800; }
      .mini-close {
        width: 20px;
        height: 20px;
        border-radius: 7px;
        color: var(--text-1);
        transition: background 0.15s ease, color 0.15s ease;
      }
      .mini-close svg { width: 14px; height: 14px; }
      .mini-close:hover { background: var(--line); color: var(--text-0); }

      .mini-copy {
        margin: 1px 0 2px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .mini-title {
        font-size: 12.5px;
        line-height: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .mini-artist {
        font-size: 10.5px;
        line-height: 12px;
        color: var(--text-1);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .mini-progress {
        height: 3px;
        border-radius: 999px;
        background: var(--line);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        margin-bottom: 3px;
      }
      .mini-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #ffffff));
        transition: width 0.25s linear;
      }

      .mini-controls {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .m-btn {
        flex: 0 0 26px;
        width: 26px;
        min-width: 26px;
        height: 26px;
        border-radius: 50%;
        color: var(--text-1);
        transition: color 0.14s ease, background 0.14s ease, transform 0.1s ease;
      }
      .m-btn svg { width: 15px; height: 15px; }
      .m-btn:hover { color: var(--text-0); background: var(--line); }
      .m-btn:active { transform: scale(0.88); }

      .m-play {
        flex: 0 0 30px;
        width: 30px;
        min-width: 30px;
        height: 30px;
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent);
      }
      .m-play svg { width: 16px; height: 16px; }
      .m-play .pause-symbol { display: none; }
      .m-play .play-symbol { margin-left: 1px; }
      .m-play.playing .play-symbol { display: none; }
      .m-play.playing .pause-symbol { display: block; }
      .m-play:hover { filter: brightness(1.08); }

      .m-like.liked { color: var(--accent); }
      .m-like.liked svg { fill: var(--accent); }

      .m-vol {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .m-vol input {
        -webkit-appearance: none;
        appearance: none;
        width: 64px;
        height: 3.5px;
        border-radius: 999px;
        outline: none;
        cursor: pointer;
        background: linear-gradient(to right, var(--accent) var(--fill, 80%), var(--line) var(--fill, 80%));
      }
      .m-vol input::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--text-0);
      }
      .mini-time {
        font-size: 10px;
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
        min-width: 30px;
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="mini" data-tauri-drag-region>
      <div class="art-side">
        <img id="m-art" alt="" draggable="false" />
      </div>
      <div class="info-side">
        <div class="mini-top" data-tauri-drag-region>
          <span class="mini-brand" data-tauri-drag-region>BETTER<b>CLOUD</b></span>
          <button class="mini-close" id="m-close" aria-label="Вернуться в приложение" title="Вернуться в приложение">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg>
          </button>
        </div>

        <div class="mini-copy">
          <div class="mini-title" id="m-title">—</div>
          <div class="mini-artist" id="m-artist">—</div>
        </div>

        <div class="mini-progress" id="m-progress" title="Клик — перемотка">
          <div class="mini-progress-fill" id="m-progress-fill"></div>
        </div>

        <div class="mini-controls">
          <button class="m-btn" id="m-prev" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M6 5v14m13-14L8 12l11 7z"/></svg></button>
          <button class="m-btn m-play" id="m-play" aria-label="Пуск/пауза">
            <svg class="play-symbol" viewBox="0 0 24 24"><path d="m9 6 10 6-10 6z"/></svg>
            <svg class="pause-symbol" viewBox="0 0 24 24"><path d="M8 6h3v12H8zm5 0h3v12h-3z"/></svg>
          </button>
          <button class="m-btn" id="m-next" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7z"/></svg></button>
          <button class="m-btn m-like" id="m-like" aria-label="В избранное">
            <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10Z"/></svg>
          </button>
          <div class="m-vol">
            <svg viewBox="0 0 24 24" style="width: 14px; height: 14px; color: var(--text-2)"><path d="M11 5 6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7"/></svg>
            <input id="m-volume" type="range" min="0" max="100" value="80" aria-label="Громкость"/>
            <span class="mini-time" id="m-time">0:00</span>
          </div>
        </div>
      </div>
    </div>
    <script src="mini.js"></script>
  </body>
</html>
